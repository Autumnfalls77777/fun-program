name: Auto Commit Workflow

on:
  schedule:
    # GitHub Actions throttles cron schedules < 15 minutes.
    - cron: '*/15 * * * *'

  # Allows triggering the workflow manually anytime from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run auto-commit script
        run: python auto_commit.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Autumnfalls77777"
          git config --global user.email "prabaljaiswal69420@gmail.com"
          git add activity_log.md
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: automated contribution update"
            git push
          fi
